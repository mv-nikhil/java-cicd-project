
name: 03 - Deployment to AWS EC2

on:
  workflow_run:
    workflows:
      - "sonarqube-ci.yml"
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  deploy:
    name: Publish and Deploy Application
    runs-on: ubuntu-latest

    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.repository.full_name == github.repository

    steps:

      # 1. Checkout the same source commit
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # 2. Setup Java 17 and Maven authentication
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      # 3. Download JAR from Pipeline 2
      - name: Download JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: java-app-jar
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: target

      # 4. Publish Maven package to GitHub Packages
      - name: Publish Maven Package
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn --batch-mode deploy

      # 5. Start SSH agent
      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      # 6. Configure EC2 host verification
      - name: Add EC2 to Known Hosts
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      # 7. Copy JAR to EC2
      - name: Copy JAR to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          scp target/java-cicd-app-1.0.0.jar \
            "$EC2_USERNAME@$EC2_HOST:/tmp/app.jar"

      # 8. Deploy application and restart service
      - name: Deploy Application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          ssh "$EC2_USERNAME@$EC2_HOST" '
            set -e

            sudo install -o ubuntu -g ubuntu -m 0644 \
              /tmp/app.jar /opt/java-app/app.jar.new

            sudo mv /opt/java-app/app.jar.new \
              /opt/java-app/app.jar

            sudo systemctl restart java-app

            sudo systemctl is-active --quiet java-app

            for i in {1..15}; do
              if curl -fsS http://localhost:8080/ > /dev/null; then
                echo "Application is responding!"
                exit 0
              fi
              sleep 2
            done

            echo "Application health check failed!"
            sudo systemctl status java-app --no-pager
            exit 1
          '

      # 9. Deployment success
      - name: Deployment Success
        run: |
          echo "Maven package published successfully!"
          echo "Java application deployed successfully!"
